<!doctype html>
<html lang="en" dir="ltr">
  <body style="margin:0;background:#f7f2e8;font-family:Arial,sans-serif;color:#173a34">
    <main style="max-width:560px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #d9e4df;border-radius:18px">
      <p style="margin:0 0 8px;color:#19725f;font-weight:700">DarLugha</p>
      <h1 style="margin:0 0 16px;font-size:26px">Verify your email address</h1>
      <p>Enter the following code on the DarLugha verification page:</p>
      <p dir="ltr" style="margin:24px 0;padding:18px;text-align:center;background:#eef8f4;border-radius:12px;font-size:34px;font-weight:800;letter-spacing:8px">{{ .Token }}</p>
      <p style="font-size:14px;color:#526963">Do not share this code with anyone. If you did not create this account, you can safely ignore this email.</p>
    </main>
  </body>
</html>
